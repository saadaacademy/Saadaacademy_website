document.body.appendChild(box);
var im=box.querySelector('img'),cap=box.querySelector('figcaption'),links=[],i=0;
function show(k){i=(k+links.length)%links.length;var a=links[i],t=a.querySelector('img'),c=a.parentNode.querySelector('figcaption');im.src=a.getAttribute('href');im.alt=t?t.alt:'';cap.textContent=c?c.textContent:''}
function close(){box.hidden=true;document.body.style.overflow=''}
grid.addEventListener('click',function(e){var a=e.target.closest('.item a');if(!a)return;e.preventDefault();links=[].slice.call(grid.querySelectorAll('.item a'));show(links.indexOf(a));box.hidden=false;document.body.style.overflow='hidden';box.querySelector('.lb-x').focus()});
box.addEventListener('click',function(e){var c=e.target.classList;if(e.target===box||c.contains('lb-x'))close();else if(c.contains('lb-p'))show(i-1);else if(c.contains('lb-n'))show(i+1)});
document.addEventListener('keydown',function(e){if(box.hidden)return;if(e.key==='Escape')close();if(e.key==='ArrowLeft')show(i-1);if(e.key==='ArrowRight')show(i+1)});
}
})();
</script>
</body>
</html>
